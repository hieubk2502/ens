apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
spec:
  kafka:
    replicas: 3
    version: 3.7.0

    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false

      - name: external
        port: 9094
        type: clusterIp
        tls: false

    storage:
      type: persistent-claim
      size: 20Gi
      deleteClaim: false

  entityOperator:
    topicOperator: {}
    userOperator: {}