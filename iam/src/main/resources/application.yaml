server:
  port: 8050

spring:
  application:
    name: iam
  context: /
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ens}
    username: ${DB_USERNAME:ens-user}
    password: ${DB_PASSWORD:Aa123456@}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:ens}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    serialization:
      fail-on-empty-beans: false
    
config:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:master}
    client-id: ${KEYCLOAK_CLIENT_ID:ENS}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:3V67RYc9ruy54OcHewRFQ2o0BJQ2teHw}
